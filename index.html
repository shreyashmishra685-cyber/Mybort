<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pro Mini AI</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
body{min-height:100vh}
.typing:after{content:"▋";animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
img.ai{max-width:260px;border-radius:10px;margin-top:6px}
@media(max-width:768px){
#sidebar{position:fixed;left:0;top:0;bottom:0;
transform:translateX(-100%);
transition:.3s;z-index:50}
#sidebar.open{transform:translateX(0)}
}
</style>
</head>

<body class="bg-gray-100 dark:bg-gray-900">

<div id="loading" class="fixed inset-0 flex items-center justify-center">
Loading App...
</div>

<div id="app" class="hidden flex min-h-screen">

<!-- SIDEBAR -->

<div id="sidebar"
class="w-64 bg-white dark:bg-gray-800 border-r dark:border-gray-700 flex flex-col">

<div class="p-3 flex justify-between">
<div class="font-semibold">Chats</div>
<button id="newChat">+</button>
</div>

<div id="chatList" class="flex-1 overflow-y-auto"></div>

<div class="p-3 border-t dark:border-gray-700 space-y-2">
<button id="settingsBtn">⚙ Settings</button>
<button id="darkBtn">🌙 Theme</button>
</div>

</div>

<!-- MAIN -->

<div class="flex-1 flex flex-col">

<header class="p-3 border-b dark:border-gray-700 flex justify-between">

<button id="menuBtn" class="md:hidden">☰</button>

<div id="title" class="font-semibold">New Chat</div>

<button id="imageBtn">Image</button>

</header>

<div id="chat"
class="flex-1 overflow-y-auto p-4 space-y-4"></div>

<div class="p-3 border-t dark:border-gray-700 bg-white dark:bg-gray-800">

<div class="flex gap-2">

<textarea id="input"
rows="1"
placeholder="Ask anything..."
class="flex-1 border rounded p-2 resize-none dark:bg-gray-700"></textarea>

<button id="send"
class="bg-blue-500 text-white px-4 rounded">
Send
</button>

</div>

</div>

</div>

</div>

<!-- SETTINGS -->

<div id="modal"
class="hidden fixed inset-0 bg-black/40 flex items-center justify-center">

<div class="bg-white dark:bg-gray-800 p-5 rounded w-full max-w-sm space-y-3">

<h2 class="font-semibold">Settings</h2>

<input id="key"
placeholder="OpenRouter API Key"
class="w-full border p-2 rounded">

<select id="model"
class="w-full border p-2 rounded">

<option>deepseek/deepseek-r1:free</option>
<option>meta-llama/llama-3-8b-instruct</option>
<option>mistralai/mistral-7b-instruct</option>
<option>openchat/openchat-7b</option>

</select>

<textarea id="system"
placeholder="System Prompt"
class="w-full border p-2 rounded"></textarea>

<div class="flex justify-end gap-2">
<button id="close">Cancel</button>
<button id="save"
class="bg-blue-500 text-white px-3 py-1 rounded">
Save
</button>
</div>

</div>
</div>

<script>

const $=e=>document.querySelector(e)

marked.setOptions({mangle:false,headerIds:false})

let chats=JSON.parse(localStorage.chats||"[]")
let current=null

const settings={
key:localStorage.key||"",
model:localStorage.model||"deepseek/deepseek-r1:free",
system:localStorage.system||""
}

function save(){localStorage.chats=JSON.stringify(chats)}

function scroll(){
const c=$("#chat")
c.scrollTop=c.scrollHeight
}

function bubble(role,text,img=false){

const div=document.createElement("div")
div.className=role==="user"?"text-right":"text-left"

const box=document.createElement("div")
box.className="inline-block p-3 rounded bg-white dark:bg-gray-700 max-w-xl"

box.innerHTML=img
?`<img class="ai" src="${text}">`
:marked.parse(text)

div.appendChild(box)
$("#chat").appendChild(div)
scroll()

return box
}

function renderChats(){

$("#chatList").innerHTML=""

chats.forEach(c=>{

const d=document.createElement("div")

d.className="p-2 cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-700"

d.textContent=c.title

d.onclick=()=>{

current=c
render()

$("#sidebar").classList.remove("open")

}

$("#chatList").appendChild(d)

})

}

function render(){

$("#chat").innerHTML=""

if(!current)return

$("#title").textContent=current.title

current.messages.forEach(m=>{
bubble(m.role,m.content,m.image)
})

}

function newChat(){

const chat={
id:Date.now(),
title:"New Chat",
messages:[]
}

chats.unshift(chat)

current=chat

save()

renderChats()

render()

}

async function send(){

if(!current)newChat()

const msg=$("#input").value.trim()

if(!msg)return

if(!settings.key){
alert("Add OpenRouter API key")
return
}

$("#input").value=""

if(current.messages.length===0){
current.title=msg.slice(0,30)
renderChats()
}

current.messages.push({role:"user",content:msg})

bubble("user",msg)

const aiBox=bubble("ai","<span class='typing'></span>")

try{

const res=await fetch(
"https://openrouter.ai/api/v1/chat/completions",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+settings.key
},
body:JSON.stringify({
model:settings.model,
stream:true,
messages:[
{role:"system",content:settings.system},
...current.messages
]
})
})

if(!res.ok){
aiBox.innerHTML="API Error "+res.status
return
}

const reader=res.body.getReader()
const decoder=new TextDecoder()

let text=""

while(true){

const {done,value}=await reader.read()

if(done)break

const chunk=decoder.decode(value,{stream:true})

chunk.split("\n").forEach(l=>{

if(!l.startsWith("data:"))return

const d=l.replace("data:","").trim()

if(d==="[DONE]")return

try{

const j=JSON.parse(d)

const t=j.choices?.[0]?.delta?.content

if(t){

text+=t

aiBox.innerHTML=marked.parse(text)

scroll()

}

}catch{}

})

}

current.messages.push({role:"assistant",content:text})

save()

}catch{
aiBox.innerHTML="Connection Error"
}

}

async function image(){

if(!current)newChat()

const prompt=$("#input").value.trim()

if(!prompt)return

if(!settings.key){
alert("Add API key")
return
}

$("#input").value=""

current.messages.push({role:"user",content:prompt})

bubble("user",prompt)

const box=bubble("ai","Generating image...")

try{

const res=await fetch(
"https://openrouter.ai/api/v1/images/generations",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+settings.key
},
body:JSON.stringify({
model:"stabilityai/sdxl",
prompt:prompt
})
})

if(!res.ok){
box.innerHTML="Image API Error "+res.status
return
}

const data=await res.json()

const url=data?.data?.[0]?.url ||
`data:image/png;base64,${data?.data?.[0]?.b64_json}`

if(url){

box.innerHTML=`<img class="ai" src="${url}">`

current.messages.push({
role:"assistant",
content:url,
image:true
})

save()

}else{

box.innerHTML="Image failed"

}

}catch{
box.innerHTML="Image API error"
}

}

$("#send").onclick=send
$("#imageBtn").onclick=image
$("#newChat").onclick=newChat

$("#menuBtn").onclick=()=>{
$("#sidebar").classList.toggle("open")
}

$("#settingsBtn").onclick=()=>{
$("#modal").classList.remove("hidden")

$("#key").value=settings.key
$("#model").value=settings.model
$("#system").value=settings.system
}

$("#close").onclick=()=>$("#modal").classList.add("hidden")

$("#save").onclick=()=>{
settings.key=$("#key").value
settings.model=$("#model").value
settings.system=$("#system").value

localStorage.key=settings.key
localStorage.model=settings.model
localStorage.system=settings.system

$("#modal").classList.add("hidden")
}

$("#darkBtn").onclick=()=>{
document.documentElement.classList.toggle("dark")
localStorage.theme=document.documentElement.classList.contains("dark")
}

if(localStorage.theme==="true")
document.documentElement.classList.add("dark")

$("#input").addEventListener("input",()=>{
const el=$("#input")
el.style.height="auto"
el.style.height=el.scrollHeight+"px"
})

renderChats()

if(chats.length===0)newChat()
else{
current=chats[0]
render()
}

document.getElementById("loading").style.display="none"
document.getElementById("app").classList.remove("hidden")

</script>

</body>
  </html>
